<title>Yomineko Screens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout concept: a studio sheet. A control bar (theme, state, text size) sits over one app frame that shows the chosen screen
   exactly as shipped: bottom tabs on phones, side rail on desktop. Tokens mirror src/styles/tokens.css (AA-checked, see docs/ACCESSIBILITY.md). */
:root {
  --sakura-100:#ffdde7; --sakura-300:#ffb3c8; --mint-100:#d8f3e6; --lavender-100:#e8e0fb; --butter-100:#fff0b8;
  --bg:#fffaf5; --bg-sunken:#fff3e8; --surface:#ffffff; --surface-2:#fff1f5; --border:#f3dfe5; --border-strong:#a58a98;
  --text:#4a3548; --text-muted:#6b5666; --accent:#e8799a; --accent-gfx:#c94f77; --accent-strong:#9c3256; --accent-soft:#ffdde7; --on-accent:#3b1226;
  --success:#1b6b4e; --success-soft:#d8f3e6; --info:#5f49a8; --info-soft:#e8e0fb; --warn:#8a4a22; --warn-soft:#ffe3d1;
  --butter-ink:#7a5b00; --sky-ink:#2c5d8f; --butter-soft:#fff0b8; --sky-soft:#d6e9fb;
  --shadow:0 6px 20px rgba(184,69,106,.10); --focus-ring:#5f49a8; --focus:0 0 0 2px var(--bg),0 0 0 5px var(--focus-ring);
  --ink:#3b2a3a; --scene-a:#ffd6e2; --scene-b:#e8e0fb; --scene-c:#fff0b8; --panel:#fffdfb; --sub-bg:rgba(20,10,24,.82);
  --radius-sm:10px; --radius:18px; --radius-lg:26px; --radius-pill:999px;
  --font-scale:1;
  --font-ui:"Nunito","Noto Sans JP","Hiragino Maru Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
  --font-jp:"Zen Maru Gothic","M PLUS Rounded 1c","Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --text-sm:calc(.875rem*var(--font-scale)); --text-md:calc(1rem*var(--font-scale)); --text-lg:calc(1.25rem*var(--font-scale)); --text-xl:calc(1.75rem*var(--font-scale));
  --text-jp:calc(1.5rem*var(--font-scale));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#1f1a26; --bg-sunken:#181420; --surface:#2a2333; --surface-2:#332a3e; --border:#433752; --border-strong:#9080a3; --text:#f3e9ef; --text-muted:#b5a5b8;
  --accent:#f08fae; --accent-gfx:#f08fae; --accent-strong:#ffb3c8; --accent-soft:#4a2f40; --on-accent:#2a1620;
  --success:#7fd9b3; --success-soft:#25392f; --info:#b8a6f0; --info-soft:#322b4d; --warn:#f6b394; --warn-soft:#43302a;
  --butter-ink:#f2d98a; --sky-ink:#a9d0f5; --butter-soft:#4a4126; --sky-soft:#263a4f; --shadow:0 6px 20px rgba(0,0,0,.35); --focus-ring:#cdbcff;
  --ink:#f3e9ef; --scene-a:#3a2742; --scene-b:#2a2a4d; --scene-c:#5a4a2a; --panel:#241e2d; color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#1f1a26; --bg-sunken:#181420; --surface:#2a2333; --surface-2:#332a3e; --border:#433752; --border-strong:#9080a3; --text:#f3e9ef; --text-muted:#b5a5b8;
  --accent:#f08fae; --accent-gfx:#f08fae; --accent-strong:#ffb3c8; --accent-soft:#4a2f40; --on-accent:#2a1620;
  --success:#7fd9b3; --success-soft:#25392f; --info:#b8a6f0; --info-soft:#322b4d; --warn:#f6b394; --warn-soft:#43302a;
  --butter-ink:#f2d98a; --sky-ink:#a9d0f5; --butter-soft:#4a4126; --sky-soft:#263a4f; --shadow:0 6px 20px rgba(0,0,0,.35); --focus-ring:#cdbcff;
  --ink:#f3e9ef; --scene-a:#3a2742; --scene-b:#2a2a4d; --scene-c:#5a4a2a; --panel:#241e2d; color-scheme:dark; }
:root[data-contrast="high"] { --text:#000; --text-muted:#3a2736; --border:#5a3f50; --border-strong:#3a2736; --accent-strong:#7d1a3f; --accent-gfx:#a8325a; }
:root[data-theme="dark"][data-contrast="high"] { --text:#fff; --text-muted:#eadfe8; --border:#b8a8c6; --border-strong:#d6c8e2; --accent-strong:#ffd0de; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"])[data-contrast="high"] { --text:#fff; --text-muted:#eadfe8; --border:#b8a8c6; --border-strong:#d6c8e2; --accent-strong:#ffd0de; } }

*,*::before,*::after { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:var(--text-md)/1.6 var(--font-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:14px 24px; transition:background .25s,color .25s; }
.jp,[lang=ja] { font-family:var(--font-jp); line-height:1.9; }
ruby rt { font-size:.5em; color:var(--text-muted); }
:root[data-furigana="off"] rt { display:none; }
:root[data-vertical="on"] .vt { writing-mode:vertical-rl; text-orientation:mixed; }
button,input,select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:3px solid transparent; box-shadow:var(--focus); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.skip { position:absolute; left:8px; top:-5rem; z-index:50; padding:.5rem 1rem; border-radius:var(--radius-pill); background:var(--surface); border:2px solid var(--focus-ring); color:var(--text); }
.skip:focus { top:8px; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; scroll-behavior:auto !important; } }
:root[data-motion="reduce"] * { transition:none !important; animation:none !important; scroll-behavior:auto !important; }
@media (forced-colors: active) { .btn,.card,.flat,.chip,.sw { border:1px solid CanvasText; } }
h1,h2,h3 { margin:0; text-wrap:balance; } p { margin:0; } h1:focus { outline:none; }

/* studio bar */
.studio { max-width:1100px; margin:0 auto 12px; display:grid; gap:10px; }
.studio-top > div { min-width:0; max-width:100%; }
.studio-top { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px; }
.studio .name { font-size:var(--text-lg); font-weight:800; color:var(--accent-strong); }
.ctl { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
.ctl > div { display:grid; gap:2px; min-width:0; max-width:100%; } .ctl .lbl { font-size:.78rem; font-weight:700; color:var(--text-muted); }
.picker { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin; }
.picker button { flex:none; border:2px solid var(--border-strong); background:var(--surface); border-radius:var(--radius-pill); padding:.2rem .9rem; min-height:44px; font-weight:700; color:var(--text); }
.picker button[aria-current=true] { background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent-gfx); }
.mini-seg { display:flex; flex-wrap:wrap; max-width:100%; gap:4px; padding:4px; border-radius:var(--radius-pill); background:var(--bg-sunken); border:2px solid var(--border-strong); }
.mini-seg button { border:0; background:transparent; border-radius:var(--radius-pill); min-height:40px; padding:0 .8rem; font-weight:700; color:var(--text-muted); }
.mini-seg button[aria-checked=true] { background:var(--surface); color:var(--accent-strong); box-shadow:var(--shadow); }

/* app frame */
.app { max-width:1100px; margin:0 auto; display:flex; flex-direction:column-reverse; background:var(--bg); border:1px solid var(--border-strong); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow); min-height:680px; }
.rail { display:flex; justify-content:space-around; gap:2px; padding:6px 8px; background:var(--surface); border-top:1px solid var(--border-strong); }
.rail button { flex:1; display:grid; justify-items:center; align-content:center; gap:1px; min-height:56px; min-width:44px; border:0; border-radius:var(--radius); background:transparent; color:var(--text-muted); font-size:var(--text-sm); font-weight:700; padding:2px; }
.rail svg { width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
.rail button[aria-current=page] { background:var(--accent-soft); color:var(--accent-strong); }
.rail .wide-only { display:none; }
.screen { flex:1; min-width:0; padding:18px; display:grid; gap:14px; align-content:start; }
@media (min-width:860px) { .app { flex-direction:row; } .rail { flex-direction:column; justify-content:flex-start; width:6.5rem; flex:none; border-top:0; border-right:1px solid var(--border-strong); padding:14px 6px; overflow-y:auto; } .rail .wide-only { display:grid; } .rail .narrow-only { display:none; } .screen { padding:24px; } }

.card { background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; min-width:0; }
.card.pink { background:var(--surface-2); }
.flat { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; min-width:0; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr)); gap:14px; }
.grid3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr)); gap:12px; }
.row { display:flex; flex-wrap:wrap; align-items:center; gap:10px; } .between { justify-content:space-between; } .stack { display:grid; gap:10px; min-width:0; }
.muted { color:var(--text-muted); font-size:var(--text-sm); }
.h { font-size:var(--text-xl); font-weight:800; color:var(--accent-strong); } .h2 { font-size:var(--text-lg); font-weight:800; }
.num { font-variant-numeric:tabular-nums; font-weight:800; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:2px solid transparent; border-radius:var(--radius-pill); padding:.45rem 1.2rem; min-height:44px; font-weight:800; background:var(--accent); color:var(--on-accent); }
.btn:active { transform:scale(.97); } .btn.soft { background:var(--accent-soft); color:var(--accent-strong); }
.btn.ghost { background:transparent; border-color:var(--border-strong); color:var(--text); } .btn.lg { min-height:56px; font-size:var(--text-lg); padding:.7rem 1.8rem; }
.btn.sm { padding:.2rem .9rem; font-size:var(--text-sm); } .btn[disabled] { opacity:.6; cursor:not-allowed; }
.chip { display:inline-flex; align-items:center; gap:4px; padding:.1rem .7rem; border-radius:var(--radius-pill); background:var(--info-soft); color:var(--info); font-size:var(--text-sm); font-weight:700; }
.chip.pink { background:var(--accent-soft); color:var(--accent-strong); } .chip.mint { background:var(--success-soft); color:var(--success); }
.chip.butter { background:var(--butter-soft); color:var(--butter-ink); } .chip.sky { background:var(--sky-soft); color:var(--sky-ink); } .chip.warn { background:var(--warn-soft); color:var(--warn); }
.bar { height:12px; border-radius:var(--radius-pill); background:var(--bg-sunken); border:1px solid var(--border-strong); overflow:hidden; }
.bar i { display:block; height:100%; background:var(--accent-gfx); border-radius:inherit; } .bar.ok i { background:var(--success); } .bar.lav i { background:var(--info); }
.ring { position:relative; display:inline-grid; place-items:center; flex:none; } .ring svg { position:absolute; inset:0; width:100%; height:100%; } .ring b { position:relative; text-align:center; line-height:1.15; }
kbd { display:inline-grid; place-items:center; min-width:2rem; height:2rem; padding:0 .55rem; border-radius:var(--radius-sm); background:var(--surface); border:2px solid var(--border-strong); border-bottom-width:4px; font:700 var(--text-sm) var(--font-ui); }
.badge { width:52px; height:52px; flex:none; display:grid; place-items:center; border-radius:58% 42% 55% 45%/48% 56% 44% 52%; border:3px solid var(--ring,var(--accent-gfx)); background:var(--surface); color:var(--ink); }
.badge svg { width:60%; height:60%; fill:none; stroke:currentColor; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
.tile { display:grid; gap:8px; justify-items:start; text-align:left; border:1px solid var(--border-strong); background:var(--surface-2); border-radius:var(--radius); padding:14px; min-height:44px; }
.field { display:grid; gap:4px; } .field label { font-weight:700; }
.input,.select { min-height:44px; border:2px solid var(--border-strong); border-radius:var(--radius-sm); background:var(--surface); padding:.3rem .8rem; width:100%; }
.search { display:flex; gap:8px; align-items:center; background:var(--surface); border:2px solid var(--border-strong); border-radius:var(--radius-pill); padding:4px 6px 4px 16px; min-height:48px; }
.search input { flex:1; min-width:0; border:0; background:transparent; outline:none; min-height:40px; } .search:focus-within { box-shadow:var(--focus); }
.filters { display:flex; flex-wrap:wrap; gap:8px; }
.fchip { border:2px solid var(--border-strong); background:var(--surface); border-radius:var(--radius-pill); min-height:40px; padding:0 .9rem; font-weight:700; }
.fchip[aria-pressed=true] { background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent-gfx); }
.list { display:grid; gap:0; margin:0; padding:0; list-style:none; } .list > li { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); min-height:56px; flex-wrap:wrap; } .list > li:last-child { border-bottom:0; }
.list .grow { flex:1; min-width:10rem; display:grid; }
.tabs { display:flex; gap:4px; border-bottom:2px solid var(--border); overflow-x:auto; }
.tabs button { border:0; background:transparent; min-height:44px; padding:0 14px; font-weight:700; color:var(--text-muted); border-bottom:4px solid transparent; margin-bottom:-2px; }
.tabs button[aria-selected=true] { color:var(--accent-strong); border-bottom-color:var(--accent-gfx); }
.crumb { color:var(--text-muted); font-size:var(--text-sm); }

/* states */
.state { display:grid; justify-items:center; gap:10px; text-align:center; padding:32px 16px; border:2px dashed var(--border-strong); border-radius:var(--radius-lg); background:var(--surface-2); }
.state p { max-width:38ch; color:var(--text-muted); }
.alert { display:flex; gap:12px; padding:16px; border-radius:var(--radius); background:var(--warn-soft); border:2px solid var(--warn); }
.alert .mk { flex:none; width:2rem; height:2rem; border-radius:50%; display:grid; place-items:center; font-weight:800; background:var(--warn); color:var(--bg); }
.sk { display:grid; gap:10px; } .sk span { display:block; height:1rem; border-radius:99px; background:linear-gradient(90deg,var(--bg-sunken),var(--surface-2),var(--bg-sunken)); background-size:200% 100%; animation:sh 1.4s linear infinite; } .sk span.blk { height:5rem; border-radius:var(--radius); }
@keyframes sh { to { background-position:-200% 0; } }
.toast { position:sticky; bottom:12px; justify-self:center; background:var(--text); color:var(--bg); border-radius:var(--radius-pill); padding:.5rem 1.2rem; font-weight:700; }

/* home */
.hello { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.week { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center; } .week span { display:grid; place-items:center; aspect-ratio:1; min-width:2.2rem; border-radius:50%; background:var(--bg-sunken); color:var(--text-muted); font-size:var(--text-sm); font-weight:700; }
.week span.done { background:var(--accent-gfx); color:#fff; } .week span.today { background:var(--surface); color:var(--accent-strong); border:3px solid var(--accent-gfx); }
.cont { display:flex; gap:12px; align-items:center; } .thumb { width:64px; height:84px; flex:none; border-radius:var(--radius-sm); background:linear-gradient(160deg,var(--scene-a),var(--scene-b)); border:2px solid var(--ink); display:grid; place-items:center; } .thumb.wide { width:100px; height:64px; background:linear-gradient(160deg,var(--scene-b),var(--scene-c)); }
.steps { display:flex; gap:6px; } .steps i { flex:1; height:8px; border-radius:99px; background:var(--bg-sunken); border:1px solid var(--border-strong); } .steps i.on { background:var(--accent-gfx); border-color:var(--accent-gfx); }

/* srs */
.srs-card { text-align:center; display:grid; gap:12px; justify-items:center; padding:28px 18px; min-height:300px; align-content:center; }
.srs-word { font-size:calc(3.4rem*var(--font-scale)); line-height:1.5; }
.grades { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,7rem),1fr)); gap:8px; } .grades button { border:2px solid transparent; border-radius:var(--radius); min-height:64px; display:grid; place-items:center; font-weight:800; padding:6px; }
.grades small { font-weight:700; } .g-again { background:var(--warn-soft); color:var(--warn); border-color:var(--warn)!important; } .g-hard { background:var(--butter-soft); color:var(--butter-ink); } .g-good { background:var(--success-soft); color:var(--success); } .g-easy { background:var(--sky-soft); color:var(--sky-ink); }
.ex { background:var(--bg-sunken); border-radius:var(--radius); padding:10px 14px; text-align:left; width:100%; }
.tools { display:flex; gap:6px; flex-wrap:wrap; }

/* dictionary */
.sheet { border-radius:var(--radius-lg); background:var(--surface); border:2px solid var(--border-strong); box-shadow:var(--shadow); padding:16px; display:grid; gap:10px; min-width:0; }
.word-big { font-size:calc(2.2rem*var(--font-scale)); } .gloss { margin:0; padding-left:1.2em; display:grid; gap:4px; }
.kc { display:flex; gap:8px; flex-wrap:wrap; } .kc div { display:grid; place-items:center; width:4.2rem; padding:6px 0; border-radius:var(--radius-sm); background:var(--surface-2); border:1px solid var(--border-strong); font-size:.75rem; color:var(--text-muted); } .kc div b { font:700 1.8rem var(--font-jp); color:var(--text); line-height:1.3; }
.word { cursor:pointer; border-radius:6px; border:0; background:transparent; padding:0 2px; font:inherit; color:inherit; min-height:1.9em; } .word:hover,.word.on { background:var(--butter-soft); color:var(--butter-ink); }
.kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:0; } .kv dt { color:var(--text-muted); font-weight:700; } .kv dd { margin:0; }

/* kana */
.kgrid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
.kgrid button { position:relative; border:2px solid var(--border-strong); border-radius:var(--radius); min-height:4rem; background:var(--surface); display:grid; place-items:center; line-height:1; font-family:var(--font-jp); font-size:calc(1.6rem*var(--font-scale)); padding:6px 0; }
.kgrid button small { font:700 .75rem var(--font-ui); color:var(--text-muted); } .kgrid button em { position:absolute; top:3px; right:6px; font-style:normal; font:700 .8rem var(--font-ui); }
.kgrid .m3 { background:var(--success-soft); } .kgrid .m2 { background:var(--butter-soft); } .kgrid .m1 { background:var(--warn-soft); } .kgrid [aria-pressed=true] { box-shadow:0 0 0 4px var(--focus-ring); }
.draw { aspect-ratio:1; width:min(100%,260px); margin:auto; border-radius:var(--radius); background:var(--panel); border:2px dashed var(--border-strong); position:relative; display:grid; place-items:center; }
.draw::before,.draw::after { content:""; position:absolute; background:var(--border); } .draw::before { left:50%; top:6px; bottom:6px; width:1px; } .draw::after { top:50%; left:6px; right:6px; height:1px; }
.draw > span { position:relative; z-index:1; font:500 calc(8rem*var(--font-scale))/1 var(--font-jp); color:var(--accent-gfx); opacity:.3; }
.draw svg { position:absolute; inset:14%; z-index:2; fill:none; stroke:var(--accent-strong); stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }

/* path */
.unit { display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; } .unit:last-child { border-bottom:0; }
.unit .st { width:2.4rem; height:2.4rem; flex:none; display:grid; place-items:center; border-radius:50%; font-weight:800; border:3px solid var(--border-strong); }
.unit.done .st { background:var(--success-soft); color:var(--success); border-color:var(--success); } .unit.now .st { background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent-gfx); } .unit .grow { flex:1; min-width:10rem; display:grid; }

/* library / reader / player */
.cover { aspect-ratio:3/4; border-radius:var(--radius); border:2px solid var(--ink); background:linear-gradient(160deg,var(--scene-a),var(--scene-b)); display:grid; place-items:center; position:relative; }
.cover.v { aspect-ratio:16/9; background:linear-gradient(160deg,var(--scene-b),var(--scene-c)); }
.cover .tag { position:absolute; left:6px; top:6px; }
.drop { border:3px dashed var(--border-strong); border-radius:var(--radius-lg); padding:22px; display:grid; gap:8px; justify-items:center; text-align:center; background:var(--surface-2); }
.reader { background:var(--bg-sunken); border-radius:var(--radius); border:1px solid var(--border-strong); padding:14px; display:grid; gap:12px; justify-items:center; }
.page { width:min(100%,380px); aspect-ratio:3/4.1; background:var(--panel); border:3px solid var(--ink); border-radius:6px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1.2fr; gap:6px; padding:6px; position:relative; }
.page .pn { border:2px solid var(--ink); border-radius:4px; background:linear-gradient(160deg,var(--scene-a),var(--scene-b)); position:relative; overflow:hidden; display:grid; place-items:center; } .page .pn.wide { grid-column:1 / 3; background:linear-gradient(160deg,var(--scene-b),var(--scene-c)); }

      return h1('Phím tắt', 'Bấm "Đổi", rồi nhấn phím mới. Nhấn Esc để huỷ. Trùng phím sẽ có cảnh báo.') + '<div class="row between"><span class="chip sky">Dùng được bằng bàn phím, tay cầm và màn hình đọc</span><div class="row"><button class="btn ghost sm" data-act="clash">Thử trường hợp trùng phím</button><button class="btn ghost" data-act="resetkeys">Đặt lại mặc định</button></div></div>' +
      (st.clash ? '<div class="alert" role="alert"><span class="mk" aria-hidden="true">!</span><div><strong>Phím K đã dùng cho "Phát / dừng"</strong><br>Bạn muốn gán lại cho "Mở tìm kiếm"? Phím cũ sẽ bị bỏ.<div class="row" style="margin-top:8px"><button class="btn sm" data-act="clash">Gán lại</button><button class="btn ghost sm" data-act="clash">Giữ nguyên</button></div></div></div>' : '') +
      '<div class="grid2" style="align-items:start">' + groups.map(function (g, gi) { return '<section class="card" aria-labelledby="kg' + gi + '"><h2 class="h2" id="kg' + gi + '">' + g[0] + '</h2><div>' + g[1].map(function (k) { var on = st.bind === k[2]; return '<div class="keyrow' + (on ? ' listen' : '') + '"><span>' + k[0] + '</span><span class="kk">' + (on ? '<span role="status">Nhấn phím mới…</span>' : '<span aria-label="Phím ' + k[1].join(' cộng ') + '">' + k[1].map(function (x) { return '<kbd>' + x + '</kbd>'; }).join(' ') + '</span>') + '<button class="btn soft sm" data-bind="' + k[2] + '" aria-label="' + (on ? 'Huỷ đổi phím' : 'Đổi phím cho ' + k[0]) + '">' + (on ? 'Huỷ' : 'Đổi') + '</button></span></div>'; }).join('') + '</div></section>'; }).join('') + '</div>';
    } },
    more: { label: 'Thêm', nav: 'more', render: function () {
      return h1('Thêm') + '<div class="card"><ul class="list">' + [['kana', 'kana', 'Kana & Kanji', 'Bảng chữ, tập viết'], ['path', 'path', 'Lộ trình JLPT', 'N5 đến N1'], ['decks', 'cards', 'Bộ thẻ', 'Quản lý thẻ ôn'], ['progress', 'chart', 'Tiến độ', 'Báo cáo, lịch học'], ['packs', 'pack', 'Kho nội dung & cập nhật', '2 bản mới'], ['settings', 'gear', 'Cài đặt & trợ năng', 'Giao diện, chữ, tương phản'], ['keys', 'key', 'Phím tắt', 'Tuỳ chỉnh bàn phím']].map(function (x) { return '<li><button class="tile" style="width:100%;grid-template-columns:auto 1fr;align-items:center;background:transparent;border:0" data-go="' + x[0] + '">' + badge(x[1], 'badge-sky') + '<span class="stack" style="gap:0"><strong>' + x[2] + '</strong><span class="muted">' + x[3] + '</span></span></button></li>'; }).join('') + '</ul></div>';
    } }
  };
  var ORDER = ['home', 'onboarding', 'srs', 'decks', 'dict', 'kana', 'path', 'library', 'manga', 'anime', 'progress', 'packs', 'settings', 'keys', 'more'];
  var NAV = [['home', 'Nhà', 'home', 'both'], ['srs', 'Ôn tập', 'cards', 'both'], ['dict', 'Từ điển', 'book', 'both'], ['kana', 'Kana', 'kana', 'wide'], ['path', 'Lộ trình', 'path', 'wide'], ['library', 'Thư viện', 'lib', 'both'], ['progress', 'Tiến độ', 'chart', 'wide'], ['packs', 'Nội dung', 'pack', 'wide'], ['settings', 'Cài đặt', 'gear', 'wide'], ['more', 'Thêm', 'more', 'narrow']];
  var GROUP = { home: 'home', onboarding: 'home', srs: 'srs', decks: 'srs', dict: 'dict', kana: 'kana', path: 'path', library: 'library', manga: 'library', anime: 'library', progress: 'progress', packs: 'packs', settings: 'settings', keys: 'settings', more: 'more' };
  var cur = (location.hash || '#home').slice(1); if (!screens[cur]) cur = 'home';
  var picker = document.getElementById('picker'), rail = document.getElementById('rail'), mainEl = document.getElementById('main'), ctl = document.getElementById('ctl');

  function draw(focusHeading) {
    var ae = document.activeElement, sig = ae && ae !== document.body ? sigOf(ae) : null;
    var sc = screens[cur];
    var body = (st.view !== 'normal' && sc.states) ? h1(sc.label) + stateView(sc.states) : sc.render();
    mainEl.innerHTML = body + (st.toast && cur !== 'packs' ? '<div class="toast" role="status">' + st.toast + '</div>' : '');
    ctl.innerHTML = '<div><span class="lbl" id="ltheme">Giao diện</span>' + seg('Giao diện', 'theme', [['system', 'Theo máy'], ['light', 'Sáng'], ['dark', 'Tối']], st.theme) + '</div>' +
      '<div><span class="lbl">Trạng thái màn hình</span>' + seg('Trạng thái màn hình', 'view', [['normal', 'Bình thường'], ['empty', 'Trống'], ['loading', 'Đang tải'], ['error', 'Lỗi']], st.view) + '</div>' +
      '<div><span class="lbl">Cỡ chữ</span>' + seg('Cỡ chữ', 'scale', [['100', '100%'], ['150', '150%'], ['200', '200%']], String(st.scale)) + '</div>' +
      '<div><span class="lbl">Tương phản</span>' + seg('Tương phản', 'contrast', [['off', 'Thường'], ['on', 'Cao']], st.contrast ? 'on' : 'off') + '</div>';
    picker.innerHTML = ORDER.map(function (id) { return '<button data-go="' + id + '" aria-current="' + (id === cur) + '">' + screens[id].label + '</button>'; }).join('');
    rail.innerHTML = NAV.map(function (n) { var cls = n[3] === 'wide' ? 'wide-only' : n[3] === 'narrow' ? 'narrow-only' : ''; return '<button class="' + cls + '" data-go="' + n[0] + '"' + (GROUP[cur] === n[0] ? ' aria-current="page"' : '') + '>' + ico(n[2]) + '<span>' + n[1] + '</span></button>'; }).join('');
    apply();
    if (focusHeading) { var h = document.getElementById('h1'); if (h) h.focus({ preventScroll: true }); }
    else if (sig) { var el = findSig(sig); if (el) el.focus({ preventScroll: true }); }
  }
  function sigOf(el) { return el.tagName + '|' + (el.id || '') + '|' + JSON.stringify(Object.assign({}, el.dataset)) + '|' + (el.getAttribute('aria-label') || el.textContent.slice(0, 24)); }
  function findSig(s) { var all = document.querySelectorAll('button,input,select,a'); for (var i = 0; i < all.length; i++) if (sigOf(all[i]) === s) return all[i]; return null; }
  function go(id) { cur = id; st.view = 'normal'; st.toast = ''; try { history.replaceState(null, '', '#' + id); } catch (e) { location.hash = id; } draw(true); say('Đã mở màn hình ' + screens[id].label); window.scrollTo({ top: 0 }); }
  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (screens[h] && h !== cur) { cur = h; draw(true); } });

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    var d = t.dataset;
    if (d.go) return go(d.go);
    if (d.word) { st.popup = d.word; draw(); return say('Đã mở nghĩa của ' + words[d.word].jp); }
    if (d.toggle) { st[d.toggle === 'audio' || d.toggle === 'kanawrite' ? 'x' + d.toggle : d.toggle] = !st[d.toggle === 'audio' || d.toggle === 'kanawrite' ? 'x' + d.toggle : d.toggle]; save(); draw(); return say('Đã đổi cài đặt'); }
    if (d.seg) {
      if (d.seg === 'theme') { st.theme = d.v; save(); } else if (d.seg === 'scale') { st.scale = +d.v; save(); } else if (d.seg === 'contrast') { st.contrast = d.v === 'on'; save(); } else st[d.seg] = d.v;
      draw(); return say('Đã chọn ' + t.textContent);
    }
    if (d.tab) { st[d.tab] = d.v; return draw(); }
    if (d.filt) { st.filt[d.filt] = !st.filt[d.filt]; return draw(); }
    if (d.kana) { st.kanaSel = +d.kana; return draw(); }
    if (d.line) { st.line = +d.line; return draw(); }
    if (d.bind) { st.bind = st.bind === d.bind ? null : d.bind; return draw(); }
    var a = d.act;
    if (a === 'reveal') { st.revealed = true; draw(); say('Đáp án: học tập, học bài'); }
    else if (a === 'grade') { st.revealed = false; st.undo = true; st.toast = 'Đã chấm. Hoàn tác bằng Ctrl+Z.'; draw(); say('Đã chấm thẻ, sang thẻ tiếp theo'); setTimeout(function () { st.toast = ''; draw(); }, 2500); }
    else if (a === 'undo') { st.undo = false; draw(); say('Đã hoàn tác'); }
    else if (a === 'play') { st.playing = !st.playing; draw(); }
    else if (a === 'nextline') { st.line = (st.line + 1) % 3; draw(); }
    else if (a === 'prevline') { st.line = (st.line + 2) % 3; draw(); }
    else if (a === 'sub') { st.sub = !st.sub; draw(); }
    else if (a === 'subvi') { st.subVi = !st.subVi; draw(); }
    else if (a === 'resetkeys') { st.bind = null; draw(); say('Đã đặt lại phím tắt mặc định'); }
    else if (a === 'clash') { st.clash = !st.clash; draw(); }
    else if (a === 'retry') { st.view = 'loading'; draw(); say('Đang thử lại'); setTimeout(function () { st.view = 'normal'; draw(); say('Đã tải xong'); }, 1200); }
    else if (a === 'clearfilt') { st.filt = { common: false, n5: false, verb: false }; st.view = 'normal'; draw(); }
    else if (a === 'closepop') { st.popup = null; draw(true); }
    else if (a === 'addsrs') { t.textContent = 'Đã thêm ✓'; say('Đã thêm vào thẻ ôn'); }
    else if (a === 'updateall') { st.toast = 'Đang cập nhật 3 gói…'; draw(); say('Đang cập nhật'); }
    else if (a === 'obnext') { if (st.step < 4) { st.step++; draw(true); } else go('home'); }
    else if (a === 'obback') { st.step = Math.max(1, st.step - 1); draw(true); }
  });
  document.addEventListener('change', function (e) { if (e.target.id === 'scl') { st.scale = +e.target.value; save(); draw(); } });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (st.bind) { e.preventDefault(); st.bind = null; draw(); return say('Đã đổi phím tắt'); }
    if (e.key === 'Escape' && st.popup && (cur === 'dict' || cur === 'manga' || cur === 'anime')) { st.popup = null; draw(true); return say('Đã đóng bảng tra từ'); }
    // radio groups and tab lists: arrow keys move + select (roving tabindex)
    if (t.getAttribute && (t.getAttribute('role') === 'radio' || t.getAttribute('role') === 'tab') && /^Arrow(Left|Right|Up|Down)$/.test(e.key)) {
      var sibs = Array.prototype.slice.call(t.parentElement.querySelectorAll('[role="' + t.getAttribute('role') + '"]')), i = sibs.indexOf(t), dir = /Right|Down/.test(e.key) ? 1 : -1;
      e.preventDefault(); sibs[(i + dir + sibs.length) % sibs.length].click(); return;
    }
    if (cur === 'srs' && t.tagName !== 'INPUT' && t.tagName !== 'SELECT') {
      if (e.code === 'Space' && !st.revealed && t.tagName !== 'BUTTON') { e.preventDefault(); st.revealed = true; draw(); say('Đáp án: học tập, học bài'); }
      else if (st.revealed && '1234'.indexOf(e.key) > -1 && e.key.length === 1) { st.revealed = false; st.undo = true; draw(); say('Đã chấm thẻ ' + e.key); }
    }
  });
  apply(); draw();
})();
</script>
