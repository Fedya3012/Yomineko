<title>Yomineko Screens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=Dela+Gothic+One&family=DM+Mono:wght@300;500&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout concept: "shotengai print". A retro Tokyo shopping-street poster: cream paper, flat coral/teal/mint/sky/mustard inks,
   thick ink outlines and hard offset shadows like risograph stickers. Desktop = sidebar + topbar, phone = ticket-strip tab bar
   with a raised review button. Night mode is the same street after dark (deep teal, glowing signs), drawn separately.
   Every colour pair is AA-checked; see docs/ACCESSIBILITY.md. */
:root {
  --paper:#fbf3e6; --paper-2:#f3e6cf; --card:#fffaf1; --card-2:#f7eddc;
  --ink:#0f3640; --text:#0f3640; --muted:#4a5f63; --line:#dccbb0;
  --coral:#ee7d6c; --coral-ink:#a3352a; --coral-soft:#fbdad0;
  --teal:#0f4350; --teal-soft:#d5e8e4;
  --mint:#6dae94; --mint-ink:#1c6347; --mint-soft:#dcefe5;
  --sky:#8cc4ea; --sky-ink:#235c88; --sky-soft:#dcecf8;
  --mustard:#f6c93a; --mustard-ink:#6a4f00; --mustard-soft:#fdf0c4;
  --primary:#0f4350; --on-primary:#fffaf1; --secondary:#ee7d6c; --on-secondary:#0f3640;
  --bar:#0f4350; --hard:4px 4px 0 var(--ink); --hard-sm:2px 2px 0 var(--ink);
  --focus-ring:#c2410c; --focus:0 0 0 3px var(--paper),0 0 0 6px var(--focus-ring);
  --sky-a:#dcecf8; --sky-b:#fbf3e6; --sub-bg:rgba(10,24,28,.86); --dot:rgba(15,54,64,.07);
  --r-sm:10px; --r:16px; --r-lg:24px; --pill:999px;
  --font-scale:1;
  --f-ui:"Be Vietnam Pro","Nunito","Segoe UI",system-ui,sans-serif;
  --f-disp:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --f-jp:"Zen Maru Gothic","M PLUS Rounded 1c","Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-jp-disp:"Dela Gothic One","Zen Maru Gothic","Noto Sans JP","Hiragino Sans",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"Cascadia Mono",monospace;
  --t-xs:calc(.75rem*var(--font-scale)); --t-sm:calc(.875rem*var(--font-scale)); --t-md:calc(1rem*var(--font-scale));
  --t-lg:calc(1.25rem*var(--font-scale)); --t-xl:calc(1.85rem*var(--font-scale)); --t-jp:calc(1.5rem*var(--font-scale));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper:#0f2a31; --paper-2:#0a1f25; --card:#163a43; --card-2:#1c4752; --ink:#e8dcc6; --text:#fbf3e6; --muted:#b8cdcc; --line:#2c5660;
  --coral:#ff8b76; --coral-ink:#ffb3a5; --coral-soft:#4a2a2a; --teal:#7fc4c9; --teal-soft:#1f4d55;
  --mint:#7fd1ad; --mint-ink:#7fd1ad; --mint-soft:#1d4038; --sky:#9fd3f5; --sky-ink:#a6d4f5; --sky-soft:#1d3b52;
  --mustard:#ffd35a; --mustard-ink:#ffe08a; --mustard-soft:#463d1e;
  --primary:#ff8b76; --on-primary:#10262b; --secondary:#ffd35a; --on-secondary:#10262b; --bar:#ff8b76;
  --hard:4px 4px 0 #051418; --hard-sm:2px 2px 0 #051418; --focus-ring:#ffd35a; --sky-a:#16304a; --sky-b:#0f2a31; --dot:rgba(232,220,198,.05); color-scheme:dark; } }
:root[data-theme="dark"] {
  --paper:#0f2a31; --paper-2:#0a1f25; --card:#163a43; --card-2:#1c4752; --ink:#e8dcc6; --text:#fbf3e6; --muted:#b8cdcc; --line:#2c5660;
  --coral:#ff8b76; --coral-ink:#ffb3a5; --coral-soft:#4a2a2a; --teal:#7fc4c9; --teal-soft:#1f4d55;
  --mint:#7fd1ad; --mint-ink:#7fd1ad; --mint-soft:#1d4038; --sky:#9fd3f5; --sky-ink:#a6d4f5; --sky-soft:#1d3b52;
  --mustard:#ffd35a; --mustard-ink:#ffe08a; --mustard-soft:#463d1e;
  --primary:#ff8b76; --on-primary:#10262b; --secondary:#ffd35a; --on-secondary:#10262b; --bar:#ff8b76;
  --hard:4px 4px 0 #051418; --hard-sm:2px 2px 0 #051418; --focus-ring:#ffd35a; --sky-a:#16304a; --sky-b:#0f2a31; --dot:rgba(232,220,198,.05); color-scheme:dark; }
:root[data-contrast="high"] { --text:#000; --muted:#1f2f33; --ink:#000; --line:#0f3640; --coral-ink:#7a1f15; }
:root[data-theme="dark"][data-contrast="high"] { --text:#fff; --muted:#e6f0ef; --ink:#fff; --line:#e8dcc6; --coral-ink:#ffd0c7; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"])[data-contrast="high"] { --text:#fff; --muted:#e6f0ef; --ink:#fff; --line:#e8dcc6; --coral-ink:#ffd0c7; } }

*,*::before,*::after { box-sizing:border-box; }
body { margin:0; color:var(--text); font:500 var(--t-md)/1.6 var(--f-ui);
  background:var(--paper) radial-gradient(var(--dot) 1.2px,transparent 1.3px) 0 0/14px 14px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:14px 28px; }
.jp,[lang=ja] { font-family:var(--f-jp); line-height:1.9; }
ruby rt { font-size:.5em; color:var(--muted); font-family:var(--f-jp); }
:root[data-furigana="off"] rt { display:none; }
:root[data-vertical="on"] .vt { writing-mode:vertical-rl; text-orientation:mixed; }
button,input,select { font:inherit; color:inherit; } button { cursor:pointer; }
:focus-visible { outline:3px solid transparent; box-shadow:var(--focus); border-radius:var(--r-sm); }
h1,h2,h3 { margin:0; text-wrap:balance; } p { margin:0; } h1:focus { outline:none; box-shadow:none; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.skip { position:absolute; left:8px; top:-5rem; z-index:50; padding:.5rem 1rem; border-radius:var(--pill); background:var(--card); border:2px solid var(--ink); }
.skip:focus { top:8px; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
:root[data-motion="reduce"] * { transition:none !important; animation:none !important; }
@media (forced-colors: active) { .btn,.card,.chip,.sw,.navi { border:2px solid CanvasText !important; } }

/* studio bar (outside the app) */
.studio { max-width:1180px; margin:0 auto 14px; display:grid; gap:10px; }
.studio-top { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px; }
.studio-top > div { min-width:0; max-width:100%; }
.studio .name { font:800 var(--t-lg) var(--f-disp); letter-spacing:-.01em; }
.studio .name span { font-family:var(--f-jp-disp); font-weight:400; color:var(--coral-ink); }
.ctl { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
.ctl > div { display:grid; gap:3px; min-width:0; max-width:100%; }
.lbl { font:500 var(--t-xs) var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.picker { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; scrollbar-width:thin; }
.picker button { flex:none; border:2px solid var(--ink); background:var(--card); border-radius:var(--pill); padding:.15rem .9rem; min-height:44px; font-weight:700; }
.picker button[aria-current=true] { background:var(--mustard); color:#10262b; box-shadow:var(--hard-sm); }
.seg { display:flex; flex-wrap:wrap; max-width:100%; gap:3px; padding:3px; border-radius:var(--pill); background:var(--card); border:2px solid var(--ink); }
.seg button { border:0; background:transparent; border-radius:var(--pill); min-height:40px; padding:0 .85rem; font-weight:700; color:var(--muted); }
.seg button[aria-checked=true] { background:var(--primary); color:var(--on-primary); }

/* app frame */
.app { max-width:1180px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr); background:var(--paper); border:2.5px solid var(--ink); border-radius:var(--r-lg); overflow:hidden; box-shadow:6px 6px 0 var(--ink); min-height:720px; }
.side { display:none; }
.col { display:grid; grid-template-rows:auto 1fr auto; min-width:0; }
.top { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:2px solid var(--ink); background:var(--card); flex-wrap:wrap; }
.logo { display:flex; align-items:center; gap:10px; font:800 var(--t-lg)/1.1 var(--f-disp); }
.logo small { display:block; font:400 var(--t-xs) var(--f-jp-disp); color:var(--coral-ink); letter-spacing:.2em; }
.top .gsearch { flex:1; min-width:10rem; display:none; }
.top .meta { display:flex; gap:8px; margin-left:auto; align-items:center; }
.counter { display:flex; align-items:center; gap:6px; border:2px solid var(--ink); border-radius:var(--pill); padding:2px 12px 2px 4px; background:var(--mustard-soft); font:500 var(--t-sm) var(--f-mono); min-height:40px; }
.counter b { font-weight:500; font-size:var(--t-md); }
.counter .dot { width:30px; height:30px; border-radius:50%; background:var(--coral); border:2px solid var(--ink); display:grid; place-items:center; }
.counter .dot svg { width:16px; height:16px; fill:none; stroke:#10262b; stroke-width:9; stroke-linecap:round; stroke-linejoin:round; }
.screen { min-width:0; padding:20px 16px 32px; display:grid; gap:18px; align-content:start; }
.tabbar { position:sticky; bottom:0; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); align-items:end; gap:2px; padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px)); background:var(--card); border-top:2.5px solid var(--ink); z-index:4; }
.tabbar button { display:grid; justify-items:center; gap:2px; min-height:56px; border:0; background:transparent; border-radius:var(--r); font:700 var(--t-xs) var(--f-ui); color:var(--muted); padding:4px 2px; min-width:0; }
.tabbar svg,.navi svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
.tabbar button[aria-current=page] { color:var(--text); }
.tabbar button[aria-current=page] .ic { background:var(--mustard); border-color:var(--ink); color:#10262b; }
.tabbar .ic { display:grid; place-items:center; width:44px; height:32px; border-radius:var(--pill); border:2px solid transparent; }
.tabbar .fab .ic { width:60px; height:60px; margin-top:-28px; border-radius:50%; background:var(--coral); border:2.5px solid var(--ink); box-shadow:var(--hard-sm); color:#10262b; }
.tabbar .fab[aria-current=page] .ic { background:var(--coral); }
.tabbar .fab .ic svg { width:28px; height:28px; }
@media (min-width:880px) {
  .app { grid-template-columns:15rem minmax(0,1fr); }
  .side { display:flex; flex-direction:column; gap:4px; padding:18px 12px; border-right:2.5px solid var(--ink); background:var(--card); }
  .side .logo { padding:0 6px 14px; border-bottom:2px dashed var(--line); margin-bottom:8px; }
  .side h2 { font:500 var(--t-xs) var(--f-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:12px 10px 4px; }
  .navi { display:flex; align-items:center; gap:10px; min-height:46px; padding:4px 10px; border:2px solid transparent; border-radius:var(--r); background:transparent; font-weight:700; text-align:left; width:100%; }
  .navi:hover { background:var(--card-2); }
  .navi[aria-current=page] { background:var(--mustard); color:#10262b; border-color:var(--ink); box-shadow:var(--hard-sm); }
  .navi .n { margin-left:auto; font:500 var(--t-xs) var(--f-mono); border:2px solid currentColor; border-radius:var(--pill); padding:0 7px; }
  .side .help { margin-top:auto; border:2px solid var(--ink); border-radius:var(--r); padding:12px; background:var(--sky-soft); display:grid; gap:6px; font-size:var(--t-sm); }
  .top .logo { display:none; } .top .gsearch { display:flex; }
  .tabbar { display:none; }
  .screen { padding:28px 30px 40px; }
}

/* shared pieces */
.card { background:var(--card); border:2px solid var(--ink); border-radius:var(--r); box-shadow:var(--hard); padding:18px; min-width:0; }
.card.flat { box-shadow:none; }
.card.coral { background:var(--coral-soft); } .card.mint { background:var(--mint-soft); } .card.sky { background:var(--sky-soft); } .card.mustard { background:var(--mustard-soft); } .card.teal { background:var(--teal-soft); }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr)); gap:18px; }
.grid3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr)); gap:14px; }
.row { display:flex; flex-wrap:wrap; align-items:center; gap:10px; } .between { justify-content:space-between; } .stack { display:grid; gap:10px; min-width:0; }
.muted { color:var(--muted); font-size:var(--t-sm); }
.kick { font:500 var(--t-xs) var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.kick [lang=ja] { font:700 var(--t-sm)/1.2 var(--f-jp); letter-spacing:.1em; color:var(--coral-ink); text-transform:none; }
.kick::after { content:""; flex:1; border-top:2px dashed var(--line); min-width:1.5rem; }
.h { font:800 var(--t-xl)/1.2 var(--f-disp); letter-spacing:-.02em; }
.h2 { font:800 var(--t-lg)/1.3 var(--f-disp); letter-spacing:-.01em; }
.big-num { font:300 calc(3rem*var(--font-scale))/1 var(--f-mono); letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
.big-num small { font-size:.45em; color:var(--muted); letter-spacing:0; }
.num { font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:2px solid var(--ink); border-radius:var(--pill); padding:.45rem 1.25rem; min-height:44px; font-weight:800; background:var(--primary); color:var(--on-primary); box-shadow:var(--hard-sm); transition:transform .08s, box-shadow .08s; }
.btn:active { transform:translate(2px,2px); box-shadow:0 0 0 var(--ink); }
.btn.alt { background:var(--secondary); color:var(--on-secondary); }
.btn.ghost { background:var(--card); color:var(--text); }
.btn.lg { min-height:56px; font-size:var(--t-lg); padding:.6rem 1.7rem; }
.btn.sm { padding:.15rem .9rem; font-size:var(--t-sm); box-shadow:none; }
.btn[disabled] { opacity:.55; cursor:not-allowed; box-shadow:none; }
.btn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:9; stroke-linecap:round; stroke-linejoin:round; }
.chip { display:inline-flex; align-items:center; gap:5px; padding:.05rem .65rem; border-radius:var(--pill); border:1.5px solid currentColor; font:700 var(--t-xs)/1.7 var(--f-ui); background:var(--teal-soft); color:var(--text); }
.chip.coral { background:var(--coral-soft); color:var(--coral-ink); } .chip.mint { background:var(--mint-soft); color:var(--mint-ink); }
.chip.sky { background:var(--sky-soft); color:var(--sky-ink); } .chip.mustard { background:var(--mustard-soft); color:var(--mustard-ink); }
.bar { height:14px; border-radius:var(--pill); background:var(--paper-2); border:2px solid var(--ink); overflow:hidden; }
.bar i { display:block; height:100%; background:var(--bar); }
.bar.mint i { background:var(--mint); } .bar.sky i { background:var(--sky); } .bar.mustard i { background:var(--mustard); }
.stripes { background:repeating-linear-gradient(-45deg,var(--coral) 0 8px,var(--card) 8px 16px); }
kbd { display:inline-grid; place-items:center; min-width:2.1rem; height:2.1rem; padding:0 .55rem; border-radius:var(--r-sm); background:var(--card); border:2px solid var(--ink); box-shadow:0 3px 0 var(--ink); font:500 var(--t-sm) var(--f-mono); }
.badge { width:58px; height:58px; flex:none; position:relative; display:grid; place-items:center; }
.badge::before { content:""; position:absolute; inset:0; border-radius:50%; background:var(--card); border:2px solid var(--ink); box-shadow:inset 0 0 0 5px var(--ring,var(--coral)), inset 0 0 0 7px var(--ink); }
.badge svg { position:relative; width:46%; height:46%; fill:none; stroke:var(--ink); stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
.tile { position:relative; display:grid; gap:6px; justify-items:start; text-align:left; border:2px solid var(--ink); background:var(--card); border-radius:var(--r); padding:16px; min-height:44px; box-shadow:var(--hard-sm); transition:transform .1s, box-shadow .1s; }
.tile:hover { transform:translate(-1px,-1px); box-shadow:var(--hard); }
.tile .idx { position:absolute; right:12px; top:10px; font:500 var(--t-xs) var(--f-mono); color:var(--muted); }
.select { min-height:44px; border:2px solid var(--ink); border-radius:var(--r-sm); background:var(--card); padding:.3rem .8rem; width:100%; }
.search { display:flex; gap:8px; align-items:center; background:var(--card); border:2px solid var(--ink); border-radius:var(--pill); padding:3px 4px 3px 14px; min-height:48px; }
.search svg { width:20px; height:20px; flex:none; fill:none; stroke:var(--muted); stroke-width:9; stroke-linecap:round; }
.search input { flex:1; min-width:0; border:0; background:transparent; outline:none; min-height:40px; }
.search:focus-within { box-shadow:var(--focus); }
.filters { display:flex; flex-wrap:wrap; gap:8px; }
.fchip { border:2px solid var(--ink); background:var(--card); border-radius:var(--pill); min-height:44px; padding:0 1rem; font-weight:700; }
.fchip[aria-pressed=true] { background:var(--teal-soft); box-shadow:inset 0 -4px 0 var(--primary); }
.fchip[aria-pressed=true]::before { content:"✓ "; }
.list { display:grid; margin:0; padding:0; list-style:none; } .list > li { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:2px dashed var(--line); min-height:60px; flex-wrap:wrap; } .list > li:last-child { border-bottom:0; }
.list .grow { flex:1; min-width:8rem; display:grid; }
.tabs { display:flex; gap:6px; overflow-x:auto; padding:2px 2px 6px; }
.tabs button { flex:none; border:2px solid var(--ink); background:var(--card); border-radius:var(--r-sm); min-height:44px; padding:0 16px; font-weight:700; }
.tabs button[aria-selected=true] { background:var(--primary); color:var(--on-primary); }
.ticket { position:relative; border:2px solid var(--ink); border-radius:var(--r); background:var(--card); padding:14px 22px; }
.ticket::before,.ticket::after { content:""; position:absolute; top:50%; width:20px; height:20px; margin-top:-10px; border-radius:50%; background:var(--paper); border:2px solid var(--ink); }
.ticket::before { left:-11px; clip-path:inset(0 0 0 50%); } .ticket::after { right:-11px; clip-path:inset(0 50% 0 0); }
.vlabel { writing-mode:vertical-rl; font:500 var(--t-xs) var(--f-mono); letter-spacing:.25em; color:var(--muted); text-transform:uppercase; }

/* states */
.state { display:grid; justify-items:center; gap:12px; text-align:center; padding:36px 18px; border:2.5px dashed var(--ink); border-radius:var(--r-lg); background:var(--card); }
.state p { max-width:38ch; color:var(--muted); }
.alert { display:flex; gap:14px; padding:16px; border-radius:var(--r); background:var(--coral-soft); border:2px solid var(--ink); box-shadow:var(--hard-sm); }
.alert .mk { flex:none; width:2.2rem; height:2.2rem; border-radius:50%; display:grid; place-items:center; font:800 1.1rem var(--f-disp); background:var(--coral); color:#10262b; border:2px solid var(--ink); }
.alert.info { background:var(--sky-soft); } .alert.info .mk { background:var(--sky); } .alert.ok { background:var(--mint-soft); } .alert.ok .mk { background:var(--mint); }
.sk { display:grid; gap:12px; } .sk span { display:block; height:1rem; border-radius:99px; border:2px solid var(--line); background:linear-gradient(90deg,var(--paper-2),var(--card),var(--paper-2)); background-size:200% 100%; animation:sh 1.4s linear infinite; } .sk span.blk { height:6rem; border-radius:var(--r); }
@keyframes sh { to { background-position:-200% 0; } }
.toast { position:sticky; bottom:96px; justify-self:center; background:var(--ink); color:var(--paper); border-radius:var(--pill); padding:.55rem 1.3rem; font-weight:700; box-shadow:var(--hard-sm); z-index:3; }
@media (min-width:880px) { .toast { bottom:16px; } }

/* home */
.hero { display:grid; grid-template-columns:minmax(0,1fr); border:2.5px solid var(--ink); border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--hard); background:linear-gradient(180deg,var(--sky-a),var(--sky-b)); }
.hero .txt { padding:22px; display:grid; gap:12px; align-content:center; min-width:0; }
.hero .art { display:grid; align-items:end; min-width:0; }
.hero .art svg { width:100%; height:auto; display:block; }
.hl { background:var(--mustard); color:#10262b; padding:0 .2em; border-radius:6px; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
@media (min-width:640px) { .hero { grid-template-columns:1.05fr 1fr; } }
.week { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; text-align:center; }
.week span { display:grid; place-items:center; aspect-ratio:1; border-radius:50%; border:2px solid var(--ink); background:var(--card); font:500 var(--t-xs) var(--f-mono); }
.week span.done { background:var(--coral); color:#10262b; } .week span.today { background:var(--mustard); color:#10262b; box-shadow:var(--hard-sm); }
.cont { display:flex; gap:14px; align-items:center; }

        : t === 'tro-nang' ? '<div class="grid2" style="align-items:start"><div class="card">' + '<div class="setrow"><div><strong>Cỡ chữ · <span class="num">' + st.scale + '%</span></strong><span class="muted">100% đến 200%, giao diện tự giãn theo</span></div><div style="flex:1;min-width:min(100%,11rem)"><label class="sr" for="scl">Cỡ chữ</label><input id="scl" type="range" min="100" max="200" step="25" value="' + st.scale + '" aria-valuetext="' + st.scale + ' phần trăm" style="width:100%"></div></div>' + sw('contrast', st.contrast, 'Tương phản cao', 'Chữ đen/trắng thuần, viền đậm') + sw('motion', st.motion, 'Giảm chuyển động', 'Tắt hiệu ứng. Tự bật nếu máy yêu cầu') + sw('vertical', st.vertical, 'Chữ dọc', 'Cho văn bản tiếng Nhật') + sw('furigana', st.furigana, 'Furigana', 'Hiện cách đọc trên kanji') + '</div>' +
        '<div class="card sky stack">' + kick('約束', 'Cam kết trợ năng') + '<ul class="gloss"><li>Mọi chữ đạt tương phản WCAG AA (4,5:1), cả ngày và đêm.</li><li>Dùng hết bằng bàn phím; vòng focus luôn thấy rõ.</li><li>Trình đọc màn hình: nhãn tiếng Việt, chữ Nhật gắn đúng ngôn ngữ.</li><li>Trạng thái không chỉ dựa vào màu: luôn có ký hiệu hoặc chữ.</li><li>Vùng bấm tối thiểu 44 px.</li></ul><div><button class="btn ghost sm" data-go="keys">Xem phím tắt</button></div></div></div>'
        : t === 'hoc' ? '<div class="card">' + '<div class="setrow"><div><strong>Mục tiêu mỗi ngày</strong><span class="muted">Số thẻ mới + ôn</span></div><select class="select" aria-label="Mục tiêu mỗi ngày" style="max-width:11rem"><option>25 thẻ</option><option>50 thẻ</option><option>80 thẻ</option></select></div><div class="setrow"><div><strong>Mức nhớ mong muốn</strong><span class="muted">Cao hơn = ôn nhiều hơn</span></div><select class="select" aria-label="Mức nhớ mong muốn" style="max-width:11rem"><option>85%</option><option selected>90%</option><option>95%</option></select></div>' + sw('xaudio', st.xaudio, 'Tự phát âm', 'Đọc to từ khi lật thẻ') + sw('xwrite', st.xwrite, 'Luyện viết nét cho kana', 'Tắt để dùng trắc nghiệm') + '</div>'
        : t === 'du-lieu' ? '<div class="grid2" style="align-items:start"><div class="card stack">' + kick('バックアップ', 'Sao lưu & chuyển máy') + '<p>Xuất toàn bộ tiến độ thành một tệp để giữ an toàn hoặc chuyển sang máy khác. Không cần tài khoản.</p><div class="row"><button class="btn">Xuất sao lưu</button><button class="btn ghost">Nhập sao lưu</button></div></div><div class="card coral stack">' + kick('注意', 'Xoá dữ liệu') + '<p>Không hoàn tác được. App sẽ hỏi lại một lần trước khi xoá.</p><div class="row"><button class="btn ghost">Xoá lịch sử tra từ</button><button class="btn ghost">Xoá toàn bộ tiến độ…</button></div></div></div>'
        : '<div class="card stack">' + kick('ライセンス', 'Giấy phép & ghi công') + '<div class="scroll-x"><table><thead><tr><th scope="col">Nội dung</th><th scope="col">Nguồn</th><th scope="col">Giấy phép</th></tr></thead><tbody><tr><td>Từ điển</td><td>JMdict (EDRDG)</td><td>CC BY-SA 4.0</td></tr><tr><td>Kanji</td><td>KANJIDIC2 (EDRDG)</td><td>CC BY-SA 4.0</td></tr><tr><td>Từ điển bổ sung</td><td>Jitendex</td><td>CC BY-SA 4.0</td></tr></tbody></table></div><p class="muted">Yomineko v0.1.0 · Mochi và mọi hình vẽ là nguyên bản.</p></div>';
      return h1('設定', 'Cài đặt') + tabs('Nhóm cài đặt', 'setTab', [['hien-thi', 'Hiển thị'], ['tro-nang', 'Trợ năng'], ['hoc', 'Học'], ['du-lieu', 'Dữ liệu'], ['gioi-thieu', 'Giấy phép']], t) + '<div role="tabpanel">' + body + '</div>';
    } },
    keys: { label: 'Phím tắt', render: function () {
      var groups = [['全般', 'Chung', [['Mở tìm kiếm', ['Ctrl', 'K'], 'g1'], ['Về trang chủ', ['G', 'H'], 'g2'], ['Xem phím tắt', ['?'], 'g3']]], ['復習', 'Ôn tập', [['Lật thẻ', ['Space'], 'a1'], ['Quên / Khó', ['1', '2'], 'a2'], ['Được / Dễ', ['3', '4'], 'a3'], ['Hoàn tác', ['Ctrl', 'Z'], 'a4']]], ['漫画', 'Đọc truyện', [['Trang sau', ['←'], 'm1'], ['Trang trước', ['→'], 'm2'], ['Tra từ đang trỏ', ['D'], 'm3'], ['Phóng to / nhỏ', ['+', '−'], 'm4']]], ['アニメ', 'Xem phim', [['Phát / dừng', ['K'], 'v1'], ['Câu trước / sau', ['J', 'L'], 'v2'], ['Bật/tắt phụ đề', ['C'], 'v3'], ['Lặp câu', ['R'], 'v4']]]];
      return h1('ショートカット', 'Phím tắt', 'Bấm "Đổi", rồi nhấn phím mới. Nhấn Esc để huỷ.') + '<div class="row between"><span class="chip sky">Bàn phím · tay cầm · trình đọc màn hình</span><div class="row"><button class="btn ghost sm" data-act="clash">Thử trùng phím</button><button class="btn ghost sm" data-act="resetkeys">Đặt lại mặc định</button></div></div>' +
      (st.clash ? '<div class="alert" role="alert"><span class="mk" aria-hidden="true">!</span><div><strong>Phím K đang dùng cho "Phát / dừng"</strong><br>Gán lại cho "Mở tìm kiếm"? Phím cũ sẽ bị bỏ.<div class="row" style="margin-top:8px"><button class="btn sm" data-act="clash">Gán lại</button><button class="btn ghost sm" data-act="clash">Giữ nguyên</button></div></div></div>' : '') +
      '<div class="grid2" style="align-items:start">' + groups.map(function (g, gi) { return '<section class="card" aria-labelledby="kg' + gi + '">' + kick(g[0], g[1]) + '<h2 class="sr" id="kg' + gi + '">' + g[1] + '</h2><div>' + g[2].map(function (k) { var on = st.bind === k[2]; return '<div class="keyrow' + (on ? ' listen' : '') + '"><span>' + k[0] + '</span><span class="kk">' + (on ? '<span role="status">Nhấn phím mới…</span>' : '<span aria-label="Phím ' + k[1].join(' cộng ') + '">' + k[1].map(function (x) { return '<kbd>' + x + '</kbd>'; }).join(' ') + '</span>') + '<button class="btn ghost sm" data-bind="' + k[2] + '" aria-label="' + (on ? 'Huỷ đổi phím' : 'Đổi phím cho ' + k[0]) + '">' + (on ? 'Huỷ' : 'Đổi') + '</button></span></div>'; }).join('') + '</div></section>'; }).join('') + '</div>';
    } },
    more: { label: 'Thêm', render: function () {
      return h1('その他', 'Thêm') + '<div class="grid3">' + [['textbook', 'book', 'Sách giáo khoa', 'Minna, Genki… theo từng bài', 'coral'], ['kana', 'kana', 'Kana & Kanji', 'Bảng chữ, tập viết', 'mint'], ['path', 'path', 'Lộ trình JLPT', 'N5 đến N1', 'sky'], ['decks', 'cards', 'Bộ thẻ', 'Quản lý thẻ ôn', 'coral'], ['progress', 'chart', 'Tiến độ', 'Báo cáo, lịch học', 'mustard'], ['packs', 'pack', 'Kho nội dung', '2 bản cập nhật', 'teal'], ['settings', 'gear', 'Cài đặt & trợ năng', 'Giao diện, chữ, tương phản', 'coral'], ['keys', 'key', 'Phím tắt', 'Tuỳ chỉnh bàn phím', 'sky']].map(function (x, i) { return '<button class="tile" data-go="' + x[0] + '"><span class="idx" aria-hidden="true">' + pad(i + 1) + '</span>' + badge(x[1], x[4]) + '<strong>' + x[2] + '</strong><span class="muted">' + x[3] + '</span></button>'; }).join('') + '</div>';
    } }
  };
  var ORDER = ['home', 'onboarding', 'srs', 'decks', 'dict', 'kana', 'path', 'textbook', 'lesson', 'library', 'manga', 'anime', 'progress', 'packs', 'settings', 'keys', 'more'];
  var SIDE = [['Học', [['home', 'Trang chủ', 'home'], ['srs', 'Ôn tập', 'cards', '24'], ['dict', 'Từ điển', 'book'], ['kana', 'Kana & Kanji', 'kana'], ['path', 'Lộ trình', 'path'], ['textbook', 'Sách giáo khoa', 'book']]], ['Đọc & xem', [['library', 'Thư viện', 'lib']]], ['Của bạn', [['progress', 'Tiến độ', 'chart'], ['packs', 'Kho nội dung', 'pack', '2'], ['settings', 'Cài đặt', 'gear']]]];
  var TABS = [['home', 'Nhà', 'home'], ['dict', 'Từ điển', 'book'], ['srs', 'Ôn tập', 'cards', 1], ['library', 'Thư viện', 'lib'], ['more', 'Thêm', 'more']];
  var GROUP = { home: 'home', onboarding: 'home', srs: 'srs', decks: 'srs', dict: 'dict', kana: 'kana', path: 'path', textbook: 'textbook', lesson: 'textbook', library: 'library', manga: 'library', anime: 'library', progress: 'progress', packs: 'packs', settings: 'settings', keys: 'settings', more: 'more' };
  var TGROUP = { kana: 'more', path: 'more', textbook: 'more', lesson: 'more', progress: 'more', packs: 'more', settings: 'more', keys: 'more' };
  var cur = (location.hash || '#home').slice(1); if (!screens[cur]) cur = 'home';
  var $ = function (id) { return document.getElementById(id); };
  var logo = '<div class="logo">' + mochi(44, 'happy') + '<span>Yomineko<small lang="ja">読み猫</small></span></div>';

  function draw(focusHeading) {
    var ae = document.activeElement, sig = ae && ae !== document.body ? sigOf(ae) : null;
    var sc = screens[cur];
    $('main').innerHTML = ((st.view !== 'normal' && sc.states) ? h1('', sc.label) + stateView(sc.states) : sc.render()) + (st.toast && cur !== 'packs' ? '<div class="toast" role="status">' + st.toast + '</div>' : '');
    $('ctl').innerHTML = '<div><span class="lbl">Giao diện</span>' + seg('Giao diện', 'theme', [['system', 'Theo máy'], ['light', 'Ngày'], ['dark', 'Đêm']], st.theme) + '</div>' +
      '<div><span class="lbl">Trạng thái</span>' + seg('Trạng thái màn hình', 'view', [['normal', 'Bình thường'], ['empty', 'Trống'], ['loading', 'Đang tải'], ['error', 'Lỗi']], st.view) + '</div>' +
      '<div><span class="lbl">Cỡ chữ</span>' + seg('Cỡ chữ', 'scale', [['100', '100%'], ['150', '150%'], ['200', '200%']], String(st.scale)) + '</div>' +
      '<div><span class="lbl">Tương phản</span>' + seg('Tương phản', 'contrast', [['off', 'Thường'], ['on', 'Cao']], st.contrast ? 'on' : 'off') + '</div>';
    $('picker').innerHTML = ORDER.map(function (id) { return '<button data-go="' + id + '" aria-current="' + (id === cur) + '">' + screens[id].label + '</button>'; }).join('');
    $('side').innerHTML = logo + SIDE.map(function (g) { return '<h2>' + g[0] + '</h2>' + g[1].map(function (n) { return '<button class="navi" data-go="' + n[0] + '"' + (GROUP[cur] === n[0] ? ' aria-current="page"' : '') + '>' + ico(n[2]) + '<span>' + n[1] + '</span>' + (n[3] ? '<span class="n" aria-label="' + n[3] + ' mục mới">' + n[3] + '</span>' : '') + '</button>'; }).join(''); }).join('') + '<div class="help">' + mochi(40, 'cheer') + '<strong>Mẹo của Mochi</strong><span class="muted">Chạm vào chữ có gạch chấm để tra nghĩa ngay.</span></div>';
    $('top').innerHTML = logo + '<label class="search gsearch">' + ico('search') + '<span class="sr">Tìm kiếm</span><input placeholder="Tìm từ, kanji, bộ thẻ…  (Ctrl K)"></label><div class="meta"><span class="counter" role="img" aria-label="Chuỗi 12 ngày"><span class="dot">' + ico('flame') + '</span><b>012</b><span lang="ja">日</span></span><span class="chip coral" style="min-height:40px;font-size:var(--t-sm)">N4</span></div>';
    $('tabbar').innerHTML = TABS.map(function (n) { var on = (TGROUP[cur] || GROUP[cur]) === n[0]; return '<button class="' + (n[3] ? 'fab' : '') + '" data-go="' + n[0] + '"' + (on ? ' aria-current="page"' : '') + '><span class="ic">' + ico(n[2]) + '</span><span>' + n[1] + '</span></button>'; }).join('');
    apply();
    if (focusHeading) { var h = $('h1'); if (h) h.focus({ preventScroll: true }); }
    else if (sig) { var el = findSig(sig); if (el) el.focus({ preventScroll: true }); }
  }
  function sigOf(el) { var n = el.closest && el.closest('nav,header,main'); return el.tagName + '|' + (el.id || '') + '|' + JSON.stringify(Object.assign({}, el.dataset)) + '|' + (el.getAttribute('aria-label') || el.textContent.slice(0, 24)) + '|' + (n ? n.id || n.tagName : ''); }
  function findSig(s) { var all = document.querySelectorAll('button,input,select,a'); for (var i = 0; i < all.length; i++) if (sigOf(all[i]) === s) return all[i]; return null; }
  function go(id) { cur = id; st.view = 'normal'; st.toast = ''; try { history.replaceState(null, '', '#' + id); } catch (e) { location.hash = id; } draw(true); say('Đã mở màn hình ' + screens[id].label); }
  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (screens[h] && h !== cur) { cur = h; draw(true); } });

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    var d = t.dataset;
    if (d.go) return go(d.go);
    if (d.word) { st.popup = d.word; draw(); return say('Đã mở nghĩa của ' + words[d.word].jp); }
    if (d.toggle) { st[d.toggle] = !st[d.toggle]; save(); draw(); return say('Đã đổi cài đặt'); }
    if (d.seg) {
      if (d.seg === 'theme') { st.theme = d.v; save(); } else if (d.seg === 'scale') { st.scale = +d.v; save(); } else if (d.seg === 'contrast') { st.contrast = d.v === 'on'; save(); } else st[d.seg] = d.v;
      draw(); return say('Đã chọn ' + t.textContent);
    }
    if (d.tab) { st[d.tab] = d.v; return draw(); }
    if (d.filt) { st.filt[d.filt] = !st.filt[d.filt]; return draw(); }
    if (d.lib) { st.lib = d.lib; return draw(); }
    if (d.kana) { st.kanaSel = +d.kana; return draw(); }
    if (d.line) { st.line = +d.line; return draw(); }
    if (d.bind) { st.bind = st.bind === d.bind ? null : d.bind; return draw(); }
    var a = d.act;
    if (a === 'reveal') { st.revealed = true; draw(); say('Đáp án: học tập, học bài'); }
    else if (a === 'grade') { st.revealed = false; st.undo = true; st.toast = 'Đã chấm thẻ · Hoàn tác bằng Ctrl+Z'; draw(); say('Đã chấm thẻ, sang thẻ tiếp theo'); setTimeout(function () { st.toast = ''; draw(); }, 2500); }
    else if (a === 'undo') { st.undo = false; draw(); say('Đã hoàn tác'); }
    else if (a === 'play') { st.playing = !st.playing; draw(); }
    else if (a === 'nextline') { st.line = (st.line + 1) % 3; draw(); }
    else if (a === 'prevline') { st.line = (st.line + 2) % 3; draw(); }
    else if (a === 'sub') { st.sub = !st.sub; draw(); }
    else if (a === 'subvi') { st.subVi = !st.subVi; draw(); }
    else if (a === 'resetkeys') { st.bind = null; draw(); say('Đã đặt lại phím tắt mặc định'); }
    else if (a === 'clash') { st.clash = !st.clash; draw(); }
    else if (a === 'retry') { st.view = 'loading'; draw(); say('Đang thử lại'); setTimeout(function () { st.view = 'normal'; draw(); say('Đã tải xong'); }, 1200); }
    else if (a === 'clearfilt') { st.filt = { common: false, n5: false, verb: false }; st.view = 'normal'; draw(); }
    else if (a === 'closepop') { st.popup = null; draw(true); }
    else if (a === 'addsrs') { t.textContent = 'Đã thêm ✓'; say('Đã thêm vào thẻ ôn'); }
    else if (a === 'updateall') { st.toast = 'Đang cập nhật 3 gói…'; draw(); say('Đang cập nhật'); }
    else if (a === 'obnext') { if (st.step < 4) { st.step++; draw(true); } else go('home'); }
    else if (a === 'obback') { st.step = Math.max(1, st.step - 1); draw(true); }
  });
  document.addEventListener('change', function (e) { if (e.target.id === 'scl') { st.scale = +e.target.value; save(); draw(); } });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (st.bind) { e.preventDefault(); st.bind = null; draw(); return say('Đã đổi phím tắt'); }
    if (e.key === 'Escape' && st.popup && (cur === 'dict' || cur === 'manga' || cur === 'anime')) { st.popup = null; draw(true); return say('Đã đóng bảng tra từ'); }
    if (t.getAttribute && (t.getAttribute('role') === 'radio' || t.getAttribute('role') === 'tab') && /^Arrow(Left|Right|Up|Down)$/.test(e.key)) {
      var sibs = Array.prototype.slice.call(t.parentElement.querySelectorAll('[role="' + t.getAttribute('role') + '"]')), i = sibs.indexOf(t), dir = /Right|Down/.test(e.key) ? 1 : -1;
      e.preventDefault(); sibs[(i + dir + sibs.length) % sibs.length].click(); return;
    }
    if (cur === 'srs' && t.tagName !== 'INPUT' && t.tagName !== 'SELECT') {
      if (e.code === 'Space' && !st.revealed && t.tagName !== 'BUTTON') { e.preventDefault(); st.revealed = true; draw(); say('Đáp án: học tập, học bài'); }
      else if (st.revealed && '1234'.indexOf(e.key) > -1 && e.key.length === 1) { st.revealed = false; st.undo = true; draw(); say('Đã chấm thẻ ' + e.key); }
    }
  });
  apply(); draw();
})();
</script>
