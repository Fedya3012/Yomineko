# Builds Windows .exe + Android .apk + PWA zip and attaches them to a GitHub Release.
# Trigger: push a tag like v0.1.0  (or run manually from the Actions tab to just get the files).
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions: { contents: write }

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Use the release tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${{ github.ref_name }}"
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      # The ubuntu runner already ships the Android SDK + build-tools (ANDROID_HOME); setup-android failed with
      # "Failed to find package 'tools'", so it is not used.
      - name: Use the release tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${{ github.ref_name }}"
      - run: npm ci
      - run: npm run build
      - name: Create Android project from the web build
        run: |
          npx cap add android
          npx cap sync android
          # Obtainium only offers an update when versionCode goes up.
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "::error::Missing signing key. A tagged release must be signed with the real key, or users could not update. See README 'Ký APK'."
              exit 1
            fi
            echo "::warning::No signing key set. Using a throwaway key: this APK installs, but can NOT be updated over a later build. See README 'Ký APK'."
            keytool -genkeypair -keystore tmp.jks -alias tmp -keyalg RSA -keysize 2048 -validity 3650 -storepass tmppass -keypass tmppass -dname "CN=Yomineko"
            KEYSTORE_PASSWORD=tmppass; KEY_ALIAS=tmp; echo tmp.jks > ks.path
          else
            echo "$KEYSTORE_B64" | base64 -d > release.jks; echo release.jks > ks.path
          fi
          $BT/zipalign -p -f 4 "$UNSIGNED" aligned.apk
          $BT/apksigner sign --ks "$(cat ks.path)" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --out Yomineko.apk aligned.apk
          $BT/apksigner verify Yomineko.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: Yomineko.apk }

  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Use the release tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${{ github.ref_name }}"
      - run: npm ci
      - run: npm run build
      - run: cd dist && zip -r ../Yomineko-web.zip .
      - uses: actions/upload-artifact@v4
        with: { name: pwa-zip, path: Yomineko-web.zip }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android, pwa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
