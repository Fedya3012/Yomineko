# Publishes the PWA (web version) to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Content packs are published next to the web app: <site>/content/catalog.json
      - run: npm run packs:build -- packs-src dist/content
      # Optional Jitendex dictionary (~27 MB), in its own catalog so the normal update check never downloads it.
      # If the download fails the site still deploys, just without it.
      - name: Jitendex pack
        continue-on-error: true
        run: |
          mkdir -p data
          curl -fsSL https://github.com/stephenmk/stephenmk.github.io/releases/latest/download/jitendex-yomitan.zip -o data/jitendex-yomitan.zip
          node scripts/build-jitendex-pack.mjs --zip data/jitendex-yomitan.zip --out jitendex-src
          npm run packs:build -- jitendex-src dist/content/jitendex
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
