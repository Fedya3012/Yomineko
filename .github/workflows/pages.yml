# Publishes the PWA (web version) to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Real dictionary (JMdict + KANJIDIC2 + examples) goes into the same content feed. If the open-data
      # download fails, the site still deploys; the app then offers only the small sample dictionary.
      - name: Build dictionary packs
        continue-on-error: true
        env: { GH_TOKEN: '${{ github.token }}' }
        run: scripts/fetch-dict-packs.sh 1
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Content packs are published next to the web app: <site>/content/catalog.json
      - run: npm run packs:build -- packs-src dist/content
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
